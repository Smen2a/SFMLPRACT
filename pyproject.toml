[project]
name = "tariffrag"
version = "0.1.0"
description = "Grounded question answering over ISO-NE and NYISO tariffs and market manuals"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "anthropic>=0.40",
    "pdfplumber>=0.11.4",
    "sqlite-vec>=0.1.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Local embedding + reranking models. Heavy (pulls torch), and sit behind the
# Embedder / Reranker protocols, so the core install stays light.
local-models = ["sentence-transformers>=3.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    # Regenerates the test fixture PDFs; the fixtures themselves are committed.
    "reportlab>=4.2",
]

[project.scripts]
tariffrag = "tariffrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tariffrag"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Characters that are corpus data, not typographic slips: ISO-NE stamps every
# tariff page with an en dash between the effective date and the FERC docket
# number, and its prose uses curly quotes throughout (964 right single quotes in
# Market Rule 1 alone). Both must be matched and normalised literally.
allowed-confusables = ["–", "—", "‘", "’", "“", "”"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/tariffrag"]
# Third-party packages without bundled type stubs.
[[tool.mypy.overrides]]
module = ["pdfplumber.*", "sentence_transformers.*", "sqlite_vec.*", "selectolax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
