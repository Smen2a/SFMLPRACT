name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install
        # Core + dev only. The local-models extra pulls torch and is exercised
        # in the ingest/index jobs, not in lint and unit tests.
        run: uv pip install --system -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest

      # Layer-1 retrieval evaluation is deterministic and makes zero API calls,
      # so it runs on every push once an index fixture exists. It fails the
      # build on a >2-point recall regression.
      # - name: Retrieval eval (no API calls)
      #   run: tariffrag eval --suite retrieval --fail-under-delta 2
